# Deploy no Render (https://render.com) — host Python para Flask.
# O banco fica no Supabase (PostgreSQL); defina DATABASE_URL como secret.
services:
  - type: web
    name: conselho-de-guerra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
