<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b4b4b">
<title>{% block titulo %}Conselho de Guerra{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-publica" data-page="jogador">

<header class="topbar">
  <div class="brand">
    <span class="sigil">CG</span>
    <div>
      <h1>Conselho de Guerra</h1>
      <p class="subtitle">Baróvia - A Campanha contra Strahd</p>
    </div>
  </div>
  <div class="ciclo-box">
    <div><span class="label">Ciclo</span><strong id="cicloValor">1</strong></div>
  </div>
  <div class="topbar-actions">
    <a href="/mestre/login" class="link-btn">Mestre</a>
  </div>
</header>

{% block conteudo %}{% endblock %}

{% block scripts %}{% endblock %}
</body>
</html>
