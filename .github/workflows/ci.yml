name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar testes
        run: pytest -q

  build:
    name: Build (migrations + Docker)
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar migrations (SQLite limpo)
        env:
          DB_PATH: instance/ci.db
        run: |
          mkdir -p instance
          alembic upgrade head
          alembic current

      - name: Build da imagem Docker
        run: docker build -t conselho-de-guerra:${{ github.sha }} .
