<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conselho de Guerra — Mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/css/base.css">
<link rel="stylesheet" href="src/css/layout.css">
<link rel="stylesheet" href="src/css/mapa.css">
</head>
<body class="page-mapa">

<header class="topbar">
  <div class="brand">
    <span class="sigil">CG</span>
    <div>
      <h1>Conselho de Guerra</h1>
      <p class="subtitle">Baróvia - A Campanha contra Strahd</p>
    </div>
  </div>
  <nav class="main-nav">
    <a href="index.html" class="nav-link active">Mapa &amp; Missões</a>
    <a href="tropas.html" class="nav-link">Tropas &amp; Recursos</a>
    <a href="faccoes.html" class="nav-link">Facções</a>
  </nav>
  <div class="ciclo-box">
    <button id="cicloMenos">−</button>
    <div><span class="label">Ciclo</span><strong id="cicloValor">1</strong></div>
    <button id="cicloMais">+</button>
  </div>
  <div class="io-box">
    <button id="btnExport" title="Exportar dados (JSON)">↓</button>
    <button id="btnImport" title="Importar dados (JSON)">↑</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
</header>

<div class="map-layout">
  <div class="map-panel">
    <div class="map-wrap" id="mapWrap">
      <div class="map-title">Mapa de Baróvia</div>
      <div class="map-tools">
        <button class="btn" id="btnNovoLocal">+ Local</button>
      </div>
      <div id="mapNodes"></div>
      <div class="map-legend">
        <span><i class="lg-dot" style="background:var(--cream)"></i>Livre</span>
        <span><i class="lg-dot" style="background:var(--gray-1)"></i>Neutro</span>
        <span><i class="lg-dot" style="background:repeating-linear-gradient(45deg,var(--teal-dark) 0 2px,var(--cream) 2px 4px)"></i>Infiltrado</span>
        <span><i class="lg-dot" style="background:var(--teal-dark)"></i>Controlado</span>
        <span><i class="lg-dot" style="background:var(--coral)"></i>Hostil</span>
        <span style="opacity:.6">- passe o mouse sobre os nós</span>
      </div>
    </div>
  </div>

  <aside class="missions-sidebar">
    <div class="sidebar-head">
      <h2>Quadro de Missões</h2>
      <button class="btn btn-primary" id="btnNovaMissao">+ Missão</button>
    </div>
    <div class="missions-list" id="missoesList"></div>
  </aside>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Título</h2>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="src/js/core/constants.js"></script>
<script src="src/js/core/helpers.js"></script>
<script src="src/js/core/storage.js"></script>
<script src="src/js/core/state.js"></script>
<script src="src/js/core/missao.js"></script>
<script src="src/js/core/io.js"></script>
<script src="src/js/ui/dom.js"></script>
<script src="src/js/ui/modal.js"></script>
<script src="src/js/ui/topbar.js"></script>
<script src="src/js/pages/index.js"></script>
</body>
</html>
